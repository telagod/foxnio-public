appId: com.telagod.foxnio
productName: foxnio
executableName: foxnio
asar: false
compression: maximum
directories:
  output: dist-desktop
  buildResources: desktop
files:
  - .next/**/*
  - "!.next/cache/**/*"
  - "!.next/dev/**/*"
  - "!.next/types/**/*"
  - "!.next/trace"
  - "!.next/trace-build"
  - bin/**/*
  - lib/**/*
  - public/**/*
  - desktop/main.cjs
  - desktop/node-runtime.cjs
  - next.config.ts
  - "!node_modules/**/*.map"
  - package.json
extraResources:
  - from: desktop/runtime/node
    to: node
    filter:
      - node
      - node.exe
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  target:
    - nsis
    - portable
  icon: public/omp-web.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
    - zip
  icon: public/icon.png
  category: public.app-category.developer-tools
linux:
  executableName: foxnio
  syncDesktopName: true
  target:
    - AppImage
    - deb
  category: Development
  maintainer: foxnio maintainers <maintainers@foxnio.dev>
  icon: public/icon.png
  synopsis: Local UI for the omp coding agent
  description: Local UI for the oh-my-pi coding agent
