appId: com.telagod.foxnio
productName: foxnio
executableName: foxnio
asar: false
compression: maximum
# The UI ships en, ja and zh-CN only; the rest of Chromium's 55 locale packs are dead weight.
electronLanguages:
  - en-US
  - ja
  - zh-CN
directories:
  output: dist-desktop
  buildResources: desktop
files:
  - .next/**/*
  - "!.next/cache/**/*"
  - "!.next/dev/**/*"
  - "!.next/types/**/*"
  - "!.next/trace"
  - "!.next/trace-build"
  - bin/**/*
  - lib/**/*
  - public/**/*
  - desktop/main.cjs
  - desktop/external-url.cjs
  - desktop/node-runtime.cjs
  - desktop/startup.cjs
  - next.config.ts
  - "!node_modules/**/*.map"
  - "!**/*.test.*"
  # Client-only libraries are already compiled into .next/static, and the
  # server's runtime imports are exactly the externals listed in
  # .next/server/**/*.nft.json (next, react, react-dom, sharp, undici, ...).
  # Everything below is either build-time only or reached exclusively through
  # the static bundle, so shipping its sources only inflates the installer.
  - "!node_modules/@next/swc-*/**/*"
  - "!node_modules/@next/eslint-plugin-next/**/*"
  - "!node_modules/@mermaid-js/**/*"
  - "!node_modules/mermaid/**/*"
  - "!node_modules/lucide-react/**/*"
  - "!node_modules/@base-ui/**/*"
  - "!node_modules/es-toolkit/**/*"
  - "!node_modules/cytoscape/**/*"
  - "!node_modules/cytoscape-fcose/**/*"
  - "!node_modules/react-syntax-highlighter/**/*"
  - "!node_modules/katex/**/*"
  - "!node_modules/caniuse-lite/**/*"
  - "!node_modules/prismjs/**/*"
  - "!node_modules/mammoth/**/*"
  # jiti is a runtime dependency of the unbundled session-history worker.
  - "!node_modules/yaml/**/*"
  - package.json
extraResources:
  - from: desktop/runtime/node
    to: node
    filter:
      - node
      - node.exe
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  target:
    - nsis
    - portable
  icon: public/omp-web.ico
portable:
  artifactName: ${productName}-${version}-${os}-${arch}-portable.${ext}
nsis:
  # NSIS and portable would both resolve to the global pattern and overwrite each other.
  artifactName: ${productName}-Setup-${version}-${os}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
    - zip
  icon: public/icon.png
  category: public.app-category.developer-tools
linux:
  executableName: foxnio
  syncDesktopName: true
  target:
    - AppImage
    - deb
  category: Development
  maintainer: foxnio maintainers <maintainers@foxnio.dev>
  icon: public/icon.png
  synopsis: Local UI for the omp coding agent
  description: Local UI for the oh-my-pi coding agent
